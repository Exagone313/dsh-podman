name: CI (code)

on:
  # Branches only: a tag push runs the release workflow alone.
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "Containerfile.dsh"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "Containerfile.dsh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    # A same-repo branch already ran on push; pull_request only covers forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: true
      - name: Check Go formatting
        run: make fmt-check-go
      - name: Build binaries
        run: make build-go
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-linux-amd64
          path: bin/linux-amd64
          if-no-files-found: error
      - name: Vet
        run: make vet
      - name: Test
        run: make test-go
      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck="$(go env GOPATH)/bin/govulncheck"
          if output=$("$govulncheck" -format text -tags "containers_image_openpgp,exclude_graphdriver_btrfs,exclude_graphdriver_devicemapper" ./... 2>&1); then
            status=0
          else
            status=$?
          fi
          printf '%s\n' "$output"
          if [ "$status" -eq 3 ]; then
            if printf '%s\n' "$output" | grep 'Fixed in:' | grep -qv 'Fixed in: N/A'; then
              exit 1
            fi
            exit 0
          fi
          exit "$status"

  proto:
    name: Protobuf
    # A same-repo branch already ran on push; pull_request only covers forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf breaking compares against the latest release tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false
      - name: Install buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check the schema and the generated bindings
        run: make proto-check

  js:
    name: JS plugin
    # A same-repo branch already ran on push; pull_request only covers forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.11.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript formatting
        run: make fmt-check-ts
      - name: Lint
        run: make lint-ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Audit npm dependencies
        run: pnpm audit --audit-level=high

  images:
    name: Build dsh-podman images
    # A same-repo branch already ran on push; pull_request only covers forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    needs: [go, js]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: true
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-linux-amd64
          path: bin/linux-amd64
      - name: Build dsh-podman images
        run: make CONTAINER=docker image-go

  trivy:
    name: Trivy scan
    # A same-repo branch already ran on push; pull_request only covers forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan repository files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: '.trivyignore.yaml'
          skip-dirs: bin,dist,node_modules
      - name: Scan container misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: '.trivyignore.yaml'
          skip-dirs: bin,dist,node_modules
