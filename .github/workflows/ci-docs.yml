name: CI (docs)

on:
  # Branches only: a tag push runs the release workflow alone.
  push:
    branches:
      - "**"
    paths:
      - "**/*.md"
  pull_request:
    paths:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: dprint
    # A same-repo branch already ran on push; pull_request only covers forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.11.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check documentation formatting
        # The Makefile owns the quoted glob, and dprint.json the line width, the
        # wrapped-prose policy and the plugin versions.
        run: make fmt-check-md
