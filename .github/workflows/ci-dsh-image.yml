name: CI (dsh image)

on:
  # Branches only: a tag push runs the release workflow alone.
  push:
    branches:
      - "**"
    paths:
      - "Containerfile.dsh"
  pull_request:
    paths:
      - "Containerfile.dsh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-dsh-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build dsh image
    # A same-repo branch already ran on push; pull_request only covers forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: true
      - name: Build dsh image
        run: make CONTAINER=docker image-dsh
