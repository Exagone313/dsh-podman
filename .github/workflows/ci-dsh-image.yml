name: CI (dsh image)

on:
  # Branches only: a tag push runs the release workflow alone.
  push:
    branches:
      - "**"
    paths:
      - "Containerfile.dsh"
  pull_request:
    paths:
      - "Containerfile.dsh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-dsh-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build dsh image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: Build dsh image
        run: make CONTAINER=docker image-dsh
