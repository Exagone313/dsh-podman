version: v2
# Pinned to the generator versions recorded in internal/genproto, so a
# regeneration only changes what the .proto change does.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: internal/genproto
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: internal/genproto
    opt:
      - paths=source_relative
