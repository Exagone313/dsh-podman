# Build scripts pnpm may run. pnpm >= 11 denies every dependency's build scripts
# by default and fails the install when one is denied, so the three packages that
# need theirs (dprint's and esbuild's binary checks, protobufjs's postinstall) are
# approved here.
allowBuilds:
  dprint: true
  esbuild: true
  protobufjs: true

# pnpm >= 11 also gates every dependency behind a 1-day minimumReleaseAge.
# Both scopes below ship as a set (a dsh bump moves ~80 @deepseek-ai packages
# at once), so exempt them; every other package keeps the gate.
minimumReleaseAgeExclude:
  - "@exagone313/*"
  - "@deepseek-ai/*"

overrides:
# GHSA-mrhx-c7xc-m3w5
  zod: ^4.6.6
