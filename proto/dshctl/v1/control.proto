syntax = "proto3";
package dshctl.v1;
option go_package = "gitlab.com/Exagone313/dsh-podman/internal/genproto/dshctl/v1;dshctlv1";

service OrchestratorControl {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (Workspace);
  rpc DescribeWorkspace(DescribeWorkspaceRequest) returns (Workspace);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc GetImage(GetImageRequest) returns (Image);
  rpc BuildImage(BuildImageRequest) returns (Image);
  rpc RebuildImage(RebuildImageRequest) returns (Image);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc StartContainer(StartContainerRequest) returns (Container);
  rpc RecreateContainer(RecreateContainerRequest) returns (Workspace);
  rpc ReplaceContainer(ReplaceContainerRequest) returns (Container);
  rpc RemoveContainer(RemoveContainerRequest) returns (RemoveContainerResponse);
  rpc AddContainerMount(AddContainerMountRequest) returns (Container);
  rpc RemoveContainerMount(RemoveContainerMountRequest) returns (Container);
}

message ListProjectsRequest {}
message ListProjectsResponse { repeated Project projects = 1; }
message Project { string name = 1; string host_path = 2; }
enum MountMode { MOUNT_MODE_UNSPECIFIED = 0; MOUNT_MODE_READ_ONLY = 1; MOUNT_MODE_READ_WRITE = 2; }
message ProjectMount {
  string project_name = 1;
  MountMode mode = 2;
  string path = 3;
  string destination = 4;
}
message CreateWorkspaceRequest { string workspace_slug = 1; string image_id = 2; repeated ProjectMount mounts = 3; }
message DescribeWorkspaceRequest { string workspace_slug = 1; }
message ListWorkspacesRequest {}
message ListWorkspacesResponse { repeated Workspace workspaces = 1; }
message Workspace {
  string workspace_slug = 1;
  string container_name = 2;
  string image_id = 3;
  repeated ProjectMount mounts = 4;
  string status = 5;
  string agent_socket_path = 6;
  string agent_token = 7;
  string created_at = 8;
}
message ListImagesRequest {}
message ListImagesResponse { repeated Image images = 1; }
message Image { string image_id = 1; string base_image = 2; repeated string packages = 3; string image_tag = 4; string built_at = 5; }
message RebuildImageRequest { string image_id = 1; string base_image = 2; repeated string packages = 3; }
message GetImageRequest { string image_id = 1; }
message BuildImageRequest { string image_id = 1; string base_image = 2; repeated string packages = 3; }
message ListContainersRequest {}
message ListContainersResponse { repeated Container containers = 1; }
message Container {
  string container_name = 1;
  string workspace_slug = 2;
  string image_id = 3;
  string status = 4;
  string created_at = 5;
  repeated ProjectMount mounts = 6;
  string podman_name = 7;
  string agent_socket_path = 8;
  string agent_token = 9;
}
message StartContainerRequest { string workspace_slug = 1; string container = 2; string image_id = 3; repeated ProjectMount mounts = 4; }
message RecreateContainerRequest { string workspace_slug = 1; string image_id = 2; string container = 3; }
message ReplaceContainerRequest { string workspace_slug = 1; string container = 2; string image_id = 3; repeated ProjectMount mounts = 4; }
message RemoveContainerRequest { string workspace_slug = 1; string container = 2; }
message RemoveContainerResponse {}
message AddContainerMountRequest { string workspace_slug = 1; string container = 2; string project = 3; string path = 4; string destination = 5; MountMode mode = 6; }
message RemoveContainerMountRequest { string workspace_slug = 1; string container = 2; string project = 3; string path = 4; }
