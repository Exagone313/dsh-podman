# Copy this file into the podman-auto-update.service drop-in directory and
# reload systemd (see docs/update.md):
#   ~/.config/systemd/user/podman-auto-update.service.d/
#
# Skips an auto-update while dsh is busy: an update restarts the dsh
# container, which would interrupt a running agent. The busy script exits 0
# when dsh is idle and non-zero while a session has an open turn.

[Service]
ExecCondition=/bin/sh -c 'if [ "$$(podman inspect -f "{{.State.Running}}" dsh 2>/dev/null)" = true ]; then podman exec dsh /opt/dsh/dsh-busy.sh; fi'
