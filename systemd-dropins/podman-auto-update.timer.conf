# Copy this file into the podman-auto-update.timer drop-in directory and
# restart the timer (see docs/update.md):
#   ~/.config/systemd/user/podman-auto-update.timer.d/

[Timer]
# Runs the check at 04:30 (24h clock), without the usual up-to-15-min jitter.
# Change the OnCalendar line to pick your own time or several times a day:
#   OnCalendar=*-*-* 09:00,13:00,17:00:00   (three fixed times)
#   OnCalendar=00/2:00:00                   (every two hours)
#   OnCalendar=*:0/30                       (every 30 minutes)
#   OnCalendar=hourly                       (every hour)
OnCalendar=*-*-* 04:30:00
RandomizedDelaySec=0
