# Trivy configuration for the CI config (IaC) scan.
# DS-0002 ("Specify at least 1 USER command in Dockerfile") is skipped: the
# orchestrator and guest-agent images are static `scratch` images running a
# single non-root-ready binary, and the base images are built at runtime by the
# orchestrator.
misconfiguration:
  skip:
    - "DS-0002"
